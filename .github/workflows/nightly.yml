# Lives at .github/workflows/nightly.yml in the runcalendar-website repository (copied there by the sync).
# Rebuilds the catalogue pages from the public RunCalendar API every night after the workers have run,
# commits whatever changed, and the push deploys the site exactly as a hand push does.
name: Rebuild the catalogue
on:
  schedule:
    - cron: "30 14 * * *"     # 14:30 UTC = 03:30 NZDT / 02:30 NZST — after the overnight workers
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: catalogue
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build collections
        run: SITE_ROOT=. python3 tools/build_collections.py
      - name: Build the catalogue
        run: python3 tools/build_catalogue.py --out .
      - name: Commit and push if anything changed
        run: |
          git config user.name "RunCalendar nightly"
          git config user.email "noreply@runcalendar.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Catalogue rebuilt $(date -u +%Y-%m-%d)"
          git push
